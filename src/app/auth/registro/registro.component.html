<main>
  <div class="login-container">
    <div class="login-box">

      <!-- LOGO -->
      <img src="assets/wgk.avif" alt="logo" class="login-logo">

      <h2 class="login-title">Crear cuenta</h2>

      <form (ngSubmit)="registrar()">
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Nombre"
            [(ngModel)]="nombre"
            name="nombre"
            autocomplete="name"
            required>
        </div>

        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required>
        </div>

        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Repetir correo electrónico"
            [(ngModel)]="email2"
            name="email2"
            autocomplete="off"
            required>
        </div>

        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Contraseña"
            [(ngModel)]="clave"
            name="clave"
            autocomplete="new-password"
            required>
        </div>

        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Repetir contraseña"
            [(ngModel)]="clave2"
            name="clave2"
            autocomplete="new-password"
            required>
        </div>

        @if (error()) {
          <p class="login-error">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary w-100">
          Registrarse
        </button>
      </form>

      <p class="login-register-text">
        ¿Ya tenés cuenta?
        <a routerLink="/auth/inicio-sesion">Iniciar sesión</a>
      </p>

    </div>
  </div>
</main>
