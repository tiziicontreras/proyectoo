

<div class="ofertas-container">

    @for (p of Productos; track p.id) {

    @if (p.disponibilidad) {

    <div class="card oferta-card">

        <!-- Burbuja de oferta -->
        <span class="oferta-badge">OFERTA</span>

        <!-- Imagen -->
        <img [src]="p.img" class="card-img-top" [alt]="p.nombre">

        <div class="card-body">

            <!-- Nombre -->
            <h5 class="card-title">{{ p.nombre }}</h5>

            <!-- Descripción -->
            <p class="card-text">
                {{ p.descripcion }}
            </p>

            <!-- Precio -->
            <div class="precio-container">

                <span class="precio-original">
                    ${{ p.precio }}
                </span>

                <span class="precio-oferta">
                    ${{ p.precioOferta }}
                </span>

            </div>



            <!-- Botones -->
            <div class="d-flex gap-2">

                <!-- Agregar al carrito -->
                <button (click)="agregarCarrito(p)">
                    🛒
                </button>

                <!-- Agregar a favoritos -->
                <button (click)="agregarFavoritos(p)">
                    ❤️
                </button>

            </div>

        </div>

    </div>

    }

    }

</div>
