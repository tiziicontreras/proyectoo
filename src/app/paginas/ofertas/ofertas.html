
<div class="productos-container">

  @for (p of productos(); track p.id) {

    @if (p.disponibilidad !== false) {

      <div class="card producto-card">

        <div class="oferta-etiqueta">OFERTA</div>

        <img
          [src]="imagenUrl(p)"
          class="card-img-top"
          [alt]="p.nombre"
        >

        <div class="card-body">

          <h5 class="card-title">{{ p.nombre }}</h5>

          <p class="card-text">{{ p.descripcion }}</p>

          <div class="precios">

            <p class="precio-original">
              ${{ formatoPrecio(p.precio) }}
            </p>

            <p class="precio-oferta">
              ${{ formatoPrecio(p.precioOferta!) }}
            </p>

          </div>

          <div class="d-flex gap-2">
            <button (click)="agregarCarrito(p)">🛒</button>
            <button (click)="agregarFavoritos(p)">❤️</button>
          </div>

        </div>
      </div>

    }

  } @empty {
    <p>No hay ofertas disponibles.</p>
  }

</div>
