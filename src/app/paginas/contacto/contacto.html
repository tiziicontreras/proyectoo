<body>
  <main>

    <div class="login-container">

      <div class="login-box">

        <!-- LOGO -->
        <img src="assets/wgk.avif" alt="logo" class="login-logo">

        <h2>Contacto</h2>

        <form>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Nombre completo">
          </div>

          <div class="mb-3">
            <input
              type="email"
              class="form-control"
              placeholder="Correo electrónico">
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Asunto">
          </div>

          <div class="mb-3">
            <textarea
              class="form-control"
              rows="5"
              placeholder="Escribí tu mensaje"></textarea>
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100">
            Enviar mensaje
          </button>

        </form>

        <p class="login-register-text">
          ¿Querés volver al inicio?
          <a routerLink="Inicio">Ir al inicio</a>
        </p>

      </div>

    </div>

  </main>
</body>
