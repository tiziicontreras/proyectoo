<h1>Favoritos</h1>

@if (favoritos().length === 0) {

<div class="vacio">
  <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z" />
  </svg>
  <h2>No tenés favoritos</h2>
  <p>Guardá los productos que te gusten para verlos acá.</p>
  <a routerLink="/productos" class="vacio-btn">Ir a productos</a>
</div>

} @else {

  <table class="table table-dark table-striped">
    <thead>
      <tr>
        <th scope="col">Imagen</th>
        <th scope="col">Producto</th>
        <th scope="col">Precio</th>
        <th scope="col">Agregar al carrito</th>
        <th scope="col">Eliminar</th>
      </tr>
    </thead>

    <tbody>
      @for (p of favoritos(); track idDe(p)) {

      <tr>

        <!-- Imagen -->
        <td>
          <img [src]="imagenUrl(p)" [alt]="p.nombre" width="70">
        </td>

        <!-- Producto -->
        <td>{{ p.nombre }}</td>

        <!-- Precio -->
        <td>${{ formato(precioDe(p)) }}</td>

        <!-- Agregar al carrito -->
        <td>
          <button (click)="agregarCarrito(p)">
            🛒
          </button>
        </td>

        <!-- Eliminar -->
        <td>
          <button class="btn btn-danger" (click)="eliminar(p)">

            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill"
              viewBox="0 0 16 16">

              <path
                d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5" />
            </svg>

          </button>
        </td>

      </tr>
      }
    </tbody>
  </table>

}
