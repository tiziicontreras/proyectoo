<header class="barra">

  <!-- Izquierda: botón del menú -->
  <button class="icono-btn" type="button" aria-label="Abrir menú" (click)="abrirMenu()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Centro: logo -->
  <a routerLink="/inicio" class="logo">
    <img src="assets/wgk.avif" alt="WGK">
  </a>

  <!-- Derecha: buscar y carrito -->
  <div class="acciones">
    <a routerLink="/productos" class="icono-btn" aria-label="Buscar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.5-3.5" />
      </svg>
    </a>

    <a routerLink="/carrito" class="icono-btn carrito" aria-label="Carrito">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8h12l1 12H5L6 8z" />
        <path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
      <span class="badge-carrito">{{ carritoService.obtenerCantidadTotal() }}</span>
    </a>
  </div>

</header>

<!-- Fondo oscuro: al tocarlo se cierra el menú -->
<div class="fondo" [class.visible]="menuAbierto()" (click)="cerrarMenu()"></div>

<!-- Menú lateral -->
<aside class="menu-lateral" [class.abierto]="menuAbierto()">

  <div class="menu-cabecera">
    <span>Menú</span>
    <button class="icono-btn" type="button" aria-label="Cerrar menú" (click)="cerrarMenu()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <nav class="menu-lista">
    <a routerLink="/inicio" (click)="cerrarMenu()">Inicio</a>
    <a routerLink="/productos" (click)="cerrarMenu()">Productos</a>
    <a routerLink="/paginas/ofertas" (click)="cerrarMenu()">Ofertas</a>
    <a routerLink="/favoritos" (click)="cerrarMenu()">Favoritos</a>
    <a routerLink="/paginas/contacto" (click)="cerrarMenu()">Contacto</a>

    @if (auth.estaLogueado()) {
      <a routerLink="/paginas/compras" (click)="cerrarMenu()">Mis compras</a>
      @if (auth.esAdmin()) {
        <a routerLink="/paginas/admin" (click)="cerrarMenu()">Admin</a>
      }
      <button type="button" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/auth/inicio-sesion" (click)="cerrarMenu()">Iniciar sesión</a>
      <a routerLink="/auth/registro" (click)="cerrarMenu()">Registrarse</a>
    }
  </nav>

</aside>
